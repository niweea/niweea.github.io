{{ define "main" }}
<div class="tools-page py-4">
  <!-- Tools Grid (Responsive: 1 col on mobile, 2 cols on tablet, 3 cols on desktop) -->
  <div class="tools-grid">
    <!-- PP-OCR Text Recognition Card -->
    <a href="{{ "tools/ocr" | relURL }}" class="tool-card group">
      <div class="tool-card-top">
        <div class="tool-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" class="tool-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-3-3v6" />
          </svg>
        </div>
        <span class="tool-badge-ready">
          <span class="badge-dot"></span>
          Ready
        </span>
      </div>

      <div class="tool-card-content">
        <h2 class="tool-title group-hover:text-primary-600 dark:group-hover:text-primary-400">
          PP-OCR 文字识别
        </h2>
        <p class="tool-description">
          基于 PP-OCRv6 的浏览器端纯离线文字识别工具，支持中英文、无需上传服务器。
        </p>
      </div>

      <div class="tool-tags">
        <span class="tool-tag">PP-OCRv6</span>
        <span class="tool-tag">ONNX Web</span>
        <span class="tool-tag">本地推理</span>
      </div>

      <div class="tool-card-arrow">
        <span>打开工具</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="arrow-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </div>
    </a>
  </div>
</div>

<style>
.tools-page {
  width: 100%;
}

.tools-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}

@media (min-width: 640px) {
  .tools-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 1024px) {
  .tools-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Compact, proportional card conforming to design guidelines */
.tool-card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 0.75rem;
  padding: 1.25rem;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  min-height: 180px;
}

.dark .tool-card {
  background: rgba(38, 38, 38, 0.75);
  border-color: #404040;
}

.tool-card:hover {
  transform: translateY(-2px);
  border-color: var(--color-primary-500, #8b5cf6);
  box-shadow: 0 8px 20px -4px rgba(139, 92, 246, 0.12);
}

.dark .tool-card:hover {
  border-color: var(--color-primary-400, #a78bfa);
  box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
}

.tool-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.tool-icon-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 0.5rem;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(124, 58, 237, 0.2));
  color: var(--color-primary-600, #7c3aed);
}

.dark .tool-icon-wrapper {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(124, 58, 237, 0.3));
  color: var(--color-primary-400, #a78bfa);
}

.tool-icon {
  width: 1.25rem;
  height: 1.25rem;
}

.tool-badge-ready {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.7rem;
  font-weight: 600;
  background: #f0fdf4;
  color: #16a34a;
  border: 1px solid #bbf7d0;
}

.dark .tool-badge-ready {
  background: rgba(22, 163, 74, 0.15);
  color: #86efac;
  border-color: rgba(22, 163, 74, 0.3);
}

.badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #16a34a;
}

.dark .badge-dot {
  background: #86efac;
}

.tool-title {
  font-size: 1rem;
  font-weight: 700;
  margin: 0 0 0.35rem 0;
  color: #111827;
  transition: color 0.15s ease;
}

.dark .tool-title {
  color: #f3f4f6;
}

.tool-description {
  font-size: 0.8rem;
  line-height: 1.45;
  color: #6b7280;
  margin: 0 0 0.85rem 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.dark .tool-description {
  color: #9ca3af;
}

.tool-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-bottom: 0.85rem;
}

.tool-tag {
  font-size: 0.68rem;
  font-weight: 500;
  padding: 0.12rem 0.45rem;
  border-radius: 0.25rem;
  background: #f3f4f6;
  color: #4b5563;
}

.dark .tool-tag {
  background: #2b2b2b;
  color: #a3a3a3;
}

.tool-card-arrow {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-primary-600, #7c3aed);
  transition: gap 0.15s ease;
}

.dark .tool-card-arrow {
  color: var(--color-primary-400, #a78bfa);
}

.tool-card:hover .tool-card-arrow {
  gap: 0.45rem;
}

.arrow-icon {
  width: 0.85rem;
  height: 0.85rem;
  transition: transform 0.15s ease;
}

.tool-card:hover .arrow-icon {
  transform: translateX(2px);
}
</style>
{{ end }}
